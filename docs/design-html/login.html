    <body

            <!-- Left Side: Hero Visual -->

            <!-- Right Side: Login Form -->

                    <!-- Brand Identity -->

                        class="flex flex-col items-center md:items-start space-y-4"

                        <div class="flex items-center gap-2 group">

                                class="material-symbols-outlined text-primary-fixed text-4xl transform transition-transform group-hover:rotate-12"

                                    font-variation-settings: &quot;FILL&quot; 1;
                                "
                            >
                                music_note

                                class="font-headline-md text-headline-md font-bold tracking-tight text-primary"
                            >

                        </div>
                        <div class="text-center md:text-left">
                            <h1
                                class="font-headline-lg text-headline-lg text-on-surface"
                            >

                            <p
                                class="text-on-surface-variant font-body-md mt-2"
                            >

                    </div>
                    <!-- Login Form -->
                    <form class="space-y-6" onsubmit="event.preventDefault()">
                        <div class="space-y-4">

                                >

                                        class="material-symbols-outlined absolute left-4 text-outline"

                                                300;

                                        class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface focus:ring-0 placeholder:text-outline-variant font-body-md"
                                        id="email"
                                        placeholder="nom@exemple.cm"
                                        required=""
                                        type="email"
                                    />
                                </div>
                            </div>
                            <!-- Password Input -->

                                    for="password"

                                                300;

                                        class="w-full bg-transparent border-none py-4 pl-12 pr-12 text-on-surface focus:ring-0 placeholder:text-outline-variant font-body-md"
                                        id="password"
                                        placeholder="••••••••"
                                        required=""
                                        type="password"
                                    />
                                    <button
                                        class="absolute right-4 text-outline hover:text-primary transition-colors"
                                        type="button"
                                    >
                                        <span class="material-symbols-outlined"

                                </div>
                            </div>

                        </button>
                        <button

                        >
                            <svg
                                class="w-6 h-6 text-on-surface group-hover:scale-110 transition-transform"
                                fill="currentColor"
                                viewbox="0 0 24 24"
                            >
                                <path

        <script>
            // Micro-interactions
            document.querySelectorAll(".glass-card input").forEach((input) => {
                input.addEventListener("focus", () => {
                    input.parentElement.style.borderColor =
                        "rgba(0, 227, 139, 0.5)";
                });
                input.addEventListener("blur", () => {
                    input.parentElement.style.borderColor =
                        "rgba(255, 255, 255, 0.1)";
                });
            });

            // Simple visibility toggle
            const toggleBtn = document.querySelector(
                'button .material-symbols-outlined:contains("visibility")',
            );
            if (toggleBtn) {
                toggleBtn.parentElement.addEventListener("click", () => {
                    const input =
                        toggleBtn.parentElement.previousElementSibling;
                    if (input.type === "password") {
                        input.type = "text";
                        toggleBtn.textContent = "visibility_off";
                    } else {
                        input.type = "password";
                        toggleBtn.textContent = "visibility";
                    }
                });
            }
        </script>
    </body>
